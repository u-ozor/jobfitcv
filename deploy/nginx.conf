# deploy/nginx.conf
# Nginx reverse proxy config for EC2.
# Place at /etc/nginx/sites-available/jobfitcv
# Enable with: sudo ln -s /etc/nginx/sites-available/jobfitcv /etc/nginx/sites-enabled/
# Reload with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # replace with EC2 public IP or domain name

    # Proxy all requests to uvicorn running on port 8000.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Allow large job description payloads (POST /jobs/ingest).
        client_max_body_size 10M;

        # Keep connections alive for background task polling.
        proxy_read_timeout 120s;
    }
}

