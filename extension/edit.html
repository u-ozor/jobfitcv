<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Resume — jobfitcv</title>
  <link rel="stylesheet" href="themes.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg4);
      border-bottom: 1px solid var(--border2);
      flex-shrink: 0;
    }

    header h1 { font-size: 0.9rem; color: var(--accent); letter-spacing: 0.04em; }

    .actions { display: flex; gap: 8px; align-items: center; }

    button {
      padding: 6px 14px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
    }
    button:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: default; }

    .link-btn {
      padding: 6px 14px;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.82rem;
    }
    .link-btn:hover { border-color: var(--accent); color: var(--accent); }

    #status { font-size: 0.78rem; color: var(--text-muted); padding: 0 6px; }

    #editor {
      flex: 1;
      width: 100%;
      background: var(--bg3);
      color: var(--text);
      border: none;
      padding: 16px 20px;
      font-family: "Menlo", "Consolas", "Monaco", monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>jobfitcv / edit</h1>
    <div class="actions">
      <span id="status"></span>
      <span data-theme-picker></span>
      <a id="html-link" class="link-btn" target="_blank">View HTML</a>
      <a id="pdf-link"  class="link-btn" target="_blank">Download PDF</a>
      <button id="save-btn">Save &amp; Regenerate</button>
    </div>
  </header>

  <textarea id="editor" spellcheck="false" placeholder="Loading..."></textarea>

  <script src="config.js"></script>
  <script src="theme-picker.js"></script>
  <script src="edit.js"></script>
</body>
</html>
