<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tracking — jobfitcv</title>
  <link rel="stylesheet" href="themes.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--bg4);
      border-bottom: 1px solid var(--border2);
      gap: 12px;
    }
    header h1 { font-size: 0.9rem; color: var(--accent); letter-spacing: 0.04em; flex-shrink: 0; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .search-input {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      padding: 4px 8px;
      font-size: 0.75rem;
      font-family: inherit;
      outline: none;
      width: 200px;
      transition: border-color 0.1s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-dimmer); }

    .search-clear {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0 2px;
      line-height: 1;
      display: none;
    }
    .search-clear:hover { color: var(--text-muted); }

    .container { padding: 20px; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; min-width: 600px; }

    th {
      text-align: left;
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border2);
      white-space: nowrap;
    }

    td { padding: 8px 10px; border-bottom: 1px solid var(--border3); vertical-align: middle; }

    tr.job-row { cursor: pointer; }
    tr.job-row:hover td { background: var(--bg3); }
    tr.job-row.expanded td { background: var(--bg3); border-bottom: none; }

    tr.detail-row td { padding: 0; border-bottom: 1px solid var(--border2); background: var(--bg4); }
    tr.detail-row.hidden { display: none; }

    .detail-inner {
      padding: 14px 16px 16px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }

    /* Notes panel — left */
    .notes-panel {}
    .notes-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    textarea.notes-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.82rem;
      font-family: inherit;
      resize: none;
      overflow: hidden;
      min-height: 80px;
      line-height: 1.55;
    }
    textarea.notes-input:focus { outline: none; border-color: var(--accent); overflow-y: auto; resize: vertical; }
    textarea.notes-input::placeholder { color: var(--text-dimmer); }

    .notes-actions { margin-top: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    /* Assessment panel — right */
    .assessment-panel {}
    .assessment-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .verdict-chip {
      font-size: 0.65rem;
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .verdict-chip.submit  { background: #0d2d1a; color: #22c55e; border: 1px solid #1a4a28; }
    .verdict-chip.caveat  { background: #2d2200; color: #f59e0b; border: 1px solid #4a3800; }
    .verdict-chip.skip    { background: #2d0d0d; color: #ef4444; border: 1px solid #4a1a1a; }
    .verdict-chip.pending { background: var(--bg2); color: var(--text-dim); border: 1px solid var(--border2); }
    body[data-theme="warm"] .verdict-chip.submit  { background: #dcfce7; color: #16a34a; border-color: #bbf7d0; }
    body[data-theme="warm"] .verdict-chip.caveat  { background: #fef9c3; color: #ca8a04; border-color: #fde68a; }
    body[data-theme="warm"] .verdict-chip.skip    { background: #fee2e2; color: #dc2626; border-color: #fecaca; }

    textarea.assess-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.82rem;
      line-height: 1.55;
      font-family: inherit;
      resize: none;
      overflow: hidden;
      min-height: 80px;
    }
    textarea.assess-input:focus { outline: none; border-color: var(--accent); overflow-y: auto; resize: vertical; }
    textarea.assess-input::placeholder { color: var(--text-dimmer); }

    select {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      color: var(--text);
      padding: 4px 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent); }

    button.del-btn {
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: 3px;
      color: var(--text-dimmer);
      padding: 3px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      margin-left: auto;
    }
    button.del-btn:hover { border-color: var(--danger); color: var(--danger); }
    button.del-btn.hot   { border-color: var(--danger); color: var(--danger); }

    /* Inline row cells */
    .job-title { font-weight: 600; font-size: 0.82rem; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    a.job-src-link { font-size: 0.65rem; color: var(--text-dimmer); text-decoration: none; flex-shrink: 0; line-height: 1; }
    a.job-src-link:hover { color: var(--accent); }
    .cat-badge { font-size: 0.65rem; font-weight: 600; color: #fff; padding: 1px 5px; border-radius: 3px; letter-spacing: 0.02em; flex-shrink: 0; }
    .job-company { font-size: 0.71rem; color: var(--text-company); margin-top: 2px; }

    .track-chip {
      font-size: 0.67rem;
      background: var(--accent-bg);
      color: var(--accent);
      border-radius: 3px;
      padding: 1px 6px;
      white-space: nowrap;
    }

    .output-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .output-btns a {
      font-size: 0.67rem;
      padding: 2px 7px;
      border-radius: 3px;
      text-decoration: none;
      white-space: nowrap;
      border: 1px solid var(--border2);
      color: var(--accent);
      background: var(--accent-bg);
    }
    .output-btns a:hover { border-color: var(--accent); }
    .output-btns a.merged { color: #60a5fa; background: #0d1f36; border-color: #1e3a5f; }
    .output-btns a.merged:hover { border-color: #60a5fa; }
    body[data-theme="warm"] .output-btns a.merged { color: #2563eb; background: #eff6ff; border-color: #bfdbfe; }
    body[data-theme="warm"] .output-btns a.merged:hover { border-color: #2563eb; }

    .badge { font-size: 0.68rem; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
    .badge.pending { background: var(--bg2); color: var(--text-muted); border: 1px solid var(--border2); }

    .date-cell { font-size: 0.71rem; color: var(--text-dimmer); white-space: nowrap; }

    .row-num { font-size: 0.62rem; color: var(--text-dimmer); margin-right: 4px; min-width: 16px; display: inline-block; text-align: right; }

    .expand-arrow {
      font-size: 0.65rem; color: var(--text-dimmer); margin-right: 6px;
      transition: transform 0.15s; display: inline-block;
    }
    tr.job-row.expanded .expand-arrow { transform: rotate(90deg); color: var(--text-muted); }

    .empty { color: var(--text-muted); text-align: center; padding: 60px 20px; font-size: 0.9rem; }

    tr.batch-header-row td {
      padding: 0;
      background: var(--bg4);
      border-top: 2px solid var(--border2);
      border-bottom: 1px solid var(--border2);
    }
    .batch-header-inner {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
    }
    .batch-arrow { font-size: 0.65rem; flex-shrink: 0; }
    .batch-label { flex: 1; }
    .batch-count {
      font-size: 0.65rem;
      background: var(--bg3);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 1px 6px;
      font-weight: 400;
      letter-spacing: 0;
    }
    .batch-actions { display: flex; gap: 4px; margin-left: auto; opacity: 0; transition: opacity 0.15s; }
    tr.batch-header-row:hover .batch-actions { opacity: 1; }
    .batch-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); font-size: 0.75rem; padding: 1px 4px; border-radius: 3px;
    }
    .batch-btn:hover { background: var(--bg2); color: var(--text); }
    .batch-btn.batch-delete:hover { color: #ef4444; }

    tr.batch-header-row.drag-over td { background: var(--bg3); outline: 2px dashed var(--accent); }
    tr.job-row.dragging { opacity: 0.4; }
    .drag-handle {
      color: var(--text-dimmer); font-size: 0.85rem; cursor: grab;
      margin-right: 4px; vertical-align: middle;
    }
    .drag-handle:active { cursor: grabbing; }

    .batch-pill {
      font-size: 0.62rem;
      background: var(--bg3);
      color: var(--accent);
      border-radius: 4px;
      padding: 1px 5px;
      margin-top: 2px;
      display: inline-block;
    }

    #add-batch-btn {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 4px 10px;
      font-family: inherit;
      white-space: nowrap;
    }
    #add-batch-btn:hover { color: var(--accent); border-color: var(--accent); }

    .batch-collapsed { display: none; }
    .filter-hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>jobfitcv / tracking</h1>
    <div class="header-right">
      <input class="search-input" id="tracking-search" type="text" placeholder="Search jobs…" autocomplete="off" title="Searches: job title, company, track, focus, app status, category, week">
      <button class="search-clear" id="tracking-search-clear" title="Clear search">✕</button>
      <button id="fold-all-btn" title="Collapse / expand all weeks" style="background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text-dim);cursor:pointer;font-size:0.72rem;padding:3px 8px;font-family:inherit;">▾ Fold</button>
      <span data-theme-picker></span>
    </div>
  </header>
  <div class="container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Job</th>
          <th>Track</th>
          <th>Output</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="jobs-tbody">
        <tr><td colspan="6" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <script src="config.js"></script>
  <script src="theme-picker.js"></script>
  <script src="tracking.js"></script>
</body>
</html>
